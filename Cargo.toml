[package]
name = "turbo-text"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.36.2"
egui_commonmark = "0.25.0"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
winreg = "0.56.0"

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
codegen-units = 1

[package]
name = "turbo-text"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["glow", "default_fonts"] }
egui_commonmark = "0.25.0"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
toml = "1.1.8"
winreg = "0.56.0"

# Markdown view line height: one small patch in to_richtext (see vendor/egui_commonmark_backend/src/misc.rs)
[patch.crates-io]
egui_commonmark_backend = { path = "vendor/egui_commonmark_backend" }

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
codegen-units = 1

[build-dependencies]
winresource = "0.1.31"
